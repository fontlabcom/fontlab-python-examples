# this_file: .github/workflows/pin-freshness.yml
# Checks the Scriptmix destination pins against public Scriptmix main. Read-only: it never
# publishes and needs no credentials; App is private and not checked out, so only the App tab literal
# check skips (stated reason); the local pre-push gate still runs it.
name: Scriptmix pin freshness
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: fontlabcom/fontlab-python-scriptmix
          ref: main
          path: _scriptmix
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Run the pin checks
        env:
          FONTLAB_SCRIPTMIX_ROOT: ${{ github.workspace }}/_scriptmix
          FONTLAB_EXAMPLES_SKIP_APP_TAB: fontlab-fontlabapp is private and not checked out in public CI
        run: |
          set -o pipefail
          uv run --isolated --no-project --python 3.12 --with 'pytest>=8' \
            python -m pytest -p no:cacheprovider -rs \
            tests/test_scriptmix_pin_freshness.py tests/test_scriptmix_destinations.py | tee pytest.log
          if grep '^SKIPPED' pytest.log | grep -v 'App tab check skipped'; then
            echo "Unexpected skip: only the App tab check may skip in CI" >&2
            exit 1
          fi
